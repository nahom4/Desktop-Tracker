[package]
name = "desktop-tracker-collector"
version = "0.0.2"
edition = "2021"
description = "Desktop activity sampler for desktop-tracker (Windows + Linux)."
publish = false

[[bin]]
name = "desktop-tracker-collector"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
url = "2"
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
] }

# Both crates are pure Rust, so a Linux build needs no system -dev packages:
# zbus talks the D-Bus wire protocol directly rather than linking libdbus.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
x11rb = { version = "0.13", features = ["screensaver"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
