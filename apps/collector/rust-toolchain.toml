# Use the host's default stable toolchain, so the collector builds on Linux and
# Windows from the same checkout.
#
# On Windows the default is MSVC, which needs Visual Studio Build Tools. To
# build there without them, install the GNU toolchain and pin it here instead:
#   rustup toolchain install stable-x86_64-pc-windows-gnu
#   channel = "stable-x86_64-pc-windows-gnu"

[toolchain]
channel = "stable"
profile = "minimal"
